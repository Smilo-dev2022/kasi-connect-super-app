name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    name: Node build/test/lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - .
          - agent7-messaging
          - agent9-search
          - agent14-qa-release
          - backend
          - services/auth
          - services/media
          - wallet-service
          - web-admin
          - events-service
          - iKasiLinkMobileApp
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No package-lock.json"; fi

      - name: Lint
        run: |
          npm run lint --if-present

      - name: Test
        run: |
          npm test --if-present

      - name: Build
        run: |
          npm run build --if-present

  python-ci:
    name: Python build/test/lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: .
            req: requirements.txt
          - project: moderation_service
            req: requirements.txt
          - project: events_service
            req: requirements.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ${{ matrix.project }}/${{ matrix.req }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f "${{ matrix.req }}" ]; then pip install -r "${{ matrix.req }}"; fi

      - name: Compile bytecode (sanity)
        working-directory: ${{ matrix.project }}
        run: |
          python -m compileall . || true

      - name: Lint (placeholder)
        if: always()
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        run: |
          pip install flake8 || true
          flake8 . || true
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  node:
    name: Node - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: root
            path: .
            run_lint: true
          - project: backend
            path: backend
            run_lint: false
          - project: web-admin
            path: web-admin
            run_lint: false
          - project: agent7-messaging
            path: agent7-messaging
            run_lint: false
          - project: agent9-search
            path: agent9-search
            run_lint: false
          - project: media-service
            path: services/media
            run_lint: false
          - project: events-service
            path: events-service
            run_tests: false
            run_lint: false
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ format('{0}/package-lock.json', matrix.path) }}
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-fund --no-audit; else npm install --no-fund --no-audit; fi
      - name: Lint
        if: ${{ matrix.run_lint != false }}
        run: npm run lint --if-present
      - name: Test
        if: ${{ matrix.run_tests != false }}
        run: npm test --if-present
      - name: Upload coverage (agent7-messaging)
        if: matrix.project == 'agent7-messaging'
        uses: actions/upload-artifact@v4
        with:
          name: agent7-coverage
          path: agent7-messaging/coverage
          if-no-files-found: ignore
      - name: Build
        run: npm run build --if-present
      - name: Typecheck (root only)
        if: matrix.project == 'root'
        run: npx tsc -p tsconfig.app.json --noEmit

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies (if requirements exist)
        run: |
          set -e
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f events_service/requirements.txt ]; then pip install -r events_service/requirements.txt; fi
          if [ -f moderation_service/requirements.txt ]; then pip install -r moderation_service/requirements.txt; fi
      - run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check . --exclude node_modules --exclude dist --exclude .next --exclude build

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    if: hashFiles('infra/*.tf') != ''
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false -input=false
      - run: terraform validate