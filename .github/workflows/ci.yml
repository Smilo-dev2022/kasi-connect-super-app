name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Node dependencies (monorepo)
        run: |
          set -e
          npm ci --ignore-scripts || true
          for f in $(git ls-files "**/package.json" | grep -v "node_modules/" | xargs -I {} dirname {} | sort -u); do
            echo "Installing in $f";
            if [ -f "$f/package-lock.json" ]; then (cd "$f" && npm ci --ignore-scripts || true); fi;
          done

      - name: Lint (if configured)
        run: |
          set -e
          if npm run | grep -q "lint"; then npm run lint --if-present; fi
          for f in $(git ls-files "**/package.json" | grep -v "node_modules/" | xargs -I {} dirname {} | sort -u); do
            if [ -f "$f/package.json" ]; then (cd "$f" && npm run lint --if-present); fi;
          done

      - name: Test (Node) if present
        run: |
          set -e
          npm test --if-present || true
          for f in $(git ls-files "**/package.json" | grep -v "node_modules/" | xargs -I {} dirname {} | sort -u); do
            if [ -f "$f/package.json" ]; then (cd "$f" && npm test --if-present || true); fi;
          done

      - name: Install Python dependencies
        run: |
          set -e
          for req in $(git ls-files "**/requirements.txt"); do
            echo "Installing $req";
            pip install -r "$req" || true;
          done

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  node:
    name: Node - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: root
            path: .
            run_lint: true
          - project: super-api
            path: super-api
            run_lint: false
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ format('{0}/package-lock.json', matrix.path) }}
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-fund --no-audit; else npm install --no-fund --no-audit; fi
      - name: Lint
        if: ${{ matrix.run_lint != false }}
        run: npm run lint --if-present
      - name: Test
        if: ${{ matrix.run_tests != false }}
        run: npm test --if-present
      - name: Upload coverage (agent7-messaging)
        if: matrix.project == 'agent7-messaging'
        uses: actions/upload-artifact@v4
        with:
          name: agent7-coverage
          path: agent7-messaging/coverage
          if-no-files-found: ignore
      - name: Build
        run: npm run build --if-present
      - name: Typecheck (root only)
        if: matrix.project == 'root'
        run: npx tsc -p tsconfig.app.json --noEmit

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies (if requirements exist)
        run: |
          set -e
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # events_service deprecated from CI
          if [ -f moderation_service/requirements.txt ]; then pip install -r moderation_service/requirements.txt; fi
      - run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check . --exclude node_modules --exclude dist --exclude .next --exclude build

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    if: hashFiles('infra/*.tf') != ''
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false -input=false
      - run: terraform validate