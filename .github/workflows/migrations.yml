name: DB Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations (staging|production)'
        required: true
        default: 'staging'

jobs:
  alembic-app:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install alembic
      - name: Run alembic upgrade
        working-directory: app
        env:
          DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
        run: alembic upgrade head

  events-node:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: events-service
        run: npm ci
      - name: Run migrations
        working-directory: events-service
        env:
          EVENTS_DATABASE_URL: ${{ secrets.EVENTS_DATABASE_URL }}
        run: npm run migrate --if-present
