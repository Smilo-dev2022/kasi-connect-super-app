name: Security Scans

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  codeql:
    name: CodeQL analysis
    uses: github/codeql-action/.github/workflows/codeql.yml@v3
    with:
      languages: javascript, typescript, python

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  dependency-audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm (root)
        run: |
          if [ -f package.json ]; then npm audit --audit-level=moderate || true; fi
      - name: Audit npm (workspace packages)
        run: |
          for dir in backend events-service agent7-messaging wallet-service web-admin agent14-qa-release agent9-search; do
            if [ -f "$dir/package.json" ]; then (cd "$dir" && npm audit --audit-level=moderate || true); fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit pip
        run: |
          python -m pip install pip-audit
          for dir in app events_service moderation_service; do
            if [ -f "$dir/requirements.txt" ]; then pip-audit -r "$dir/requirements.txt" || true; fi
          done
