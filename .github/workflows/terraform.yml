name: Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Init
        working-directory: infra
        run: terraform init -backend=false
      - name: Validate
        working-directory: infra
        run: terraform validate
