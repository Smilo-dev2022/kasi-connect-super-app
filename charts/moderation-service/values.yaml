image:
  repository: ghcr.io/your-org/moderation-service-py
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8082

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: api.example.com
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - hosts: [api.example.com]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: []
