version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --address :9000 --console-address :9001
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  typesense:
    image: typesense/typesense:0.25.2
    command: ["/opt/typesense-server","--data-dir","/data","--api-key","xyz","--listen-port","8108","--enable-cors"]
    ports:
      - '8108:8108'
    volumes:
      - typesense-data:/data

  agent7-messaging:
    image: node:20-alpine
    working_dir: /app
    environment:
      - NODE_ENV=development
      - PORT=8080
      - JWT_SECRET=devsecret
      - FEATURE_FLAGS=dark_launch
      - ALLOWLIST_WARDS=Ward 48
    volumes:
      - ./agent7-messaging:/app
    command: sh -c "npm i && npm run dev"
    ports:
      - '8080:8080'


  # media service deprecated: will be ported into super-api

  search:
    build:
      context: ./agent9-search
    environment:
      - NODE_ENV=development
      - PORT=4009
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_PROTOCOL=http
      - TYPESENSE_API_KEY=xyz
    depends_on:
      - typesense
    ports:
      - '4009:4009'

  # events services deprecated: handled by super-api

  moderation:
    image: python:3.11-slim
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./moderation_service:/app
    command: bash -lc "pip install -U pip wheel setuptools && pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload"
    ports:
      - '8002:8002'

  # wallet service deprecated: handled by super-api

  web:
    image: node:20-alpine
    working_dir: /app
    environment:
      - NODE_ENV=development
      - VITE_MSG_API=http://localhost:8081
      - VITE_EVENTS_API=http://localhost:8081
      - VITE_WALLET_API=http://localhost:8081
    volumes:
      - ./:/app
    command: sh -c "npm i && npm run dev"
    depends_on:
      - agent7-messaging
    ports:
      - '5173:8080'

  # Node Events service (port 3000) for UI and smoke tests
  events_node:
    build:
      context: ./events-service
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./events-service:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm i && npm run dev"
    ports:
      - '3000:3000'

  # Python FastAPI app exposing wallet + events APIs (port 8000)
  wallet_py:
    image: python:3.13-slim
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
    command: bash -lc "pip install -U pip wheel setuptools && pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - '8000:8000'

volumes:
  redis-data: {}
  minio-data: {}
  typesense-data: {}
  pgdata: {}
