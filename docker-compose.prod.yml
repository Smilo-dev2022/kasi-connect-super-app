version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kasilink
      POSTGRES_PASSWORD: kasilink
      POSTGRES_DB: kasilink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  wallet:
    build: ./app
    environment:
      DATABASE_URL: postgres://kasilink:kasilink@db:5432/kasilink
    depends_on:
      - db

  events_py:
    build: ./events_service
    environment:
      EVENTS_DATABASE_URL: postgres://kasilink:kasilink@db:5432/kasilink
    depends_on:
      - db

  events_node:
    build: ./events-service
    environment:
      PORT: 3000
    depends_on:
      - db

  moderation:
    build: ./moderation_service
    environment:
      MOD_DB_URL: postgres://kasilink:kasilink@db:5432/kasilink
    depends_on:
      - db

volumes:
  pgdata:

