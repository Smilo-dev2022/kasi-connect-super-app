version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kasilink
      POSTGRES_PASSWORD: kasilink
      POSTGRES_DB: kasilink
    # Do not expose Postgres publicly in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  wallet:
    image: ${WALLET_IMAGE:-wallet-service:latest}
    environment:
      DATABASE_URL: ${WALLET_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet.rule=Host(`${API_BASE_HOST}`) && PathPrefix(`/api/wallet`)"
      - "traefik.http.services.wallet.loadbalancer.server.port=3000"

  events:
    image: ${EVENTS_IMAGE:-events-service-py:latest}
    environment:
      EVENTS_DATABASE_URL: ${EVENTS_DATABASE_URL}
      SEED_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.events.rule=Host(`${API_BASE_HOST}`) && (PathPrefix(`/api/events`) || PathPrefix(`/events`))"
      - "traefik.http.services.events.loadbalancer.server.port=8001"

  moderation:
    image: ${MODERATION_IMAGE:-moderation-service:latest}
    environment:
      MOD_DB_URL: ${MOD_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moderation.rule=Host(`${API_BASE_HOST}`) && PathPrefix(`/api/mod`)"
      - "traefik.http.services.moderation.loadbalancer.server.port=8082"

volumes:
  pgdata:

