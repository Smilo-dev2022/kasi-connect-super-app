{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kasi-connect.fullname" $ }}-{{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
    spec:
      serviceAccountName: {{ $svc.serviceAccountName | default "default" }}
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.aws.com
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "kasi-connect.fullname" $ }}-{{ $name }}-secrets
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.global.imageRepository }}-{{ $svc.image.name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- toYaml $svc.env | nindent 12 }}
            {{- if $svc.extraEnv }}
            {{- toYaml $svc.extraEnv | nindent 12 }}
            {{- end }}
          {{- if $svc.secrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "kasi-connect.fullname" $ }}-{{ $name }}-secrets
          {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: "/mnt/secrets"
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: {{ $svc.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ $svc.port }} }
            initialDelaySeconds: 10
            periodSeconds: 20
---
{{- if $svc.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kasi-connect.fullname" $ }}-{{ $name }}-secrets
spec:
  provider: aws
  parameters:
    objectName: {{ $svc.secrets.secretName }}
    objectType: "secretsmanager"
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kasi-connect.fullname" $ }}-{{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
spec:
  selector: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
      name: http
{{- end }}
{{- end }}
