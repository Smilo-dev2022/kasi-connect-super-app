{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kasi-connect.fullname" $ }}-{{ $name }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
{{- end }}
{{- end }}
