{{- $global := .Values.global -}}
{{- range $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: super
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
spec:
  replicas: {{ $svc.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
      annotations:
        prometheus.io/scrape: {{ $svc.metrics.scrape | default true | quote }}
        prometheus.io/port: {{ $svc.metrics.port | default $svc.port | quote }}
        prometheus.io/path: {{ $svc.metrics.path | default "/metrics" | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ $svc.name }}
          image: {{ $svc.image | default (printf "%s/%s:%s" ($global.imageRegistry | default "") $svc.name ($global.imageTag | default "latest")) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
          {{- range $key, $val := ($svc.env | default dict) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- if $svc.envFromSecrets }}
          envFrom:
          {{- range $sec := $svc.envFromSecrets }}
            - secretRef:
                name: {{ $sec }}
          {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessPath | default "/health" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessPath | default "/health" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ $svc.resources.requests.cpu | default $.Values.resources.requests.cpu }}
              memory: {{ $svc.resources.requests.memory | default $.Values.resources.requests.memory }}
            limits:
              cpu: {{ $svc.resources.limits.cpu | default $.Values.resources.limits.cpu }}
              memory: {{ $svc.resources.limits.memory | default $.Values.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: super
spec:
  selector:
    app.kubernetes.io/name: {{ $svc.name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $svc.name }}
  namespace: super
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.name }}
  namespace: super
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.name }}
  minReplicas: {{ $svc.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.cpu | default 70 }}
{{- end }}
