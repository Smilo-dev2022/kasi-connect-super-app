global:
  imageRegistry: ghcr.io
  imageRepository: your-org/kasi-connect
  imageTag: latest
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  domain: "example.com"
  tls:
    enabled: true
    certResolver: "default"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

services:
  backend:
    enabled: true
    image:
      name: backend
    port: 4000
    replicas: 2
    ingress:
      enabled: true
      subdomain: "api"
    secrets:
      enabled: true
      secretName: "kasi-connect-backend"
  events:
    enabled: true
    image:
      name: events-service
    port: 3000
    replicas: 2
    ingress:
      enabled: true
      subdomain: "events"
    secrets:
      enabled: true
      secretName: "kasi-connect-events-service"
    migrate:
      enabled: true
      command: "node"
      args: ["/app/scripts/migrate.js"]
  events_py:
    enabled: true
    image:
      name: events_service
    port: 8001
    replicas: 1
    ingress:
      enabled: true
      subdomain: "events-py"
    secrets:
      enabled: true
      secretName: "kasi-connect-events-service"
    migrate:
      enabled: true
      command: "alembic"
      args: ["upgrade", "head"]
  moderation:
    enabled: true
    image:
      name: moderation_service
    port: 8082
    replicas: 1
    ingress:
      enabled: true
      subdomain: "moderation"
  auth:
    enabled: true
    image:
      name: services-auth
    port: 4010
    replicas: 2
    ingress:
      enabled: true
      subdomain: "auth"
    secrets:
      enabled: true
      secretName: "kasi-connect-backend"
  media:
    enabled: true
    image:
      name: services-media
    port: 4008
    replicas: 2
    serviceAccountName: "kasi-connect-media-service"
    ingress:
      enabled: true
      subdomain: "media"
    secrets:
      enabled: true
      secretName: "kasi-connect-services-media"
  search:
    enabled: true
    image:
      name: agent9-search
    port: 4009
    replicas: 2
    ingress:
      enabled: true
      subdomain: "search"
    secrets:
      enabled: true
      secretName: "kasi-connect-agent9-search"
  superapi:
    enabled: true
    image:
      name: app
    port: 8000
    replicas: 1
    ingress:
      enabled: true
      subdomain: "super"
    secrets:
      enabled: true
      secretName: "kasi-connect-superapi"
    migrate:
      enabled: true
      command: "alembic"
      args: ["upgrade", "head"]
  wallet:
    enabled: true
    image:
      name: wallet-service
    port: 3000
    replicas: 2
    ingress:
      enabled: true
      subdomain: "wallet"
    secrets:
      enabled: true
      secretName: "kasi-connect-wallet-service"
  wallet:
    enabled: true
    image:
      name: wallet-service
    port: 3000
    replicas: 1
    ingress:
      enabled: true
      subdomain: "wallet"
    secrets:
      enabled: false
