global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'events'
    metrics_path: /metrics
    static_configs:
      - targets: ['events:8001']

  - job_name: 'wallet'
    metrics_path: /metrics
    static_configs:
      - targets: ['wallet:3000']

  - job_name: 'moderation'
    metrics_path: /metrics
    static_configs:
      - targets: ['moderation:8082']

  - job_name: 'auth'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth:4010']

  - job_name: 'media'
    metrics_path: /metrics
    static_configs:
      - targets: ['media:4008']
